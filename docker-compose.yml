version: '3.8'

services:
  # O Banco de dados para persistência de métricas (já mencionado no monitor.py)
  drift_db:
    image: postgres:15
    environment:
      POSTGRES_DB: drift_metrics
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"

  # Prometheus para coletar as métricas do src/monitor.py
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"

  # Grafana para visualização
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - drift_db

  # API do projeto
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:admin_password@drift_db:5432/drift_metrics
    depends_on:
      - drift_db
