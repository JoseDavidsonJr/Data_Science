name: FACAPE Data Pipeline

on:
  schedule:
    - cron: '0 0 * * 1' # Toda segunda-feira à meia-noite
  push:
    branches: [ main ]
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          make install

      - name: Fetch fresh data from MCP-Brasil
        run: make fetch

      # 1. LIGAMOS O DOCKER AQUI ANTES DO TREINO
      - name: Start Docker Stack
        run: |
          make up
          sleep 15 # Dá 15 segundinhos para o MLflow e a API iniciarem completamente

      # 2. AGORA O TREINO VAI FUNCIONAR, POIS O MLFLOW ESTÁ LIGADO
      - name: Run training pipeline
        run: make all-models

      - name: Archive production models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/

      # 3. TESTAMOS SE AS APIS ESTÃO BOAS E DESLIGAMOS TUDO
      - name: Test APIs and Shutdown Docker
        run: |
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:9090/-/healthy || exit 1
          make down